<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Something went wrong - Telecom Care</title>
    <th:block th:replace="~{fragments/common :: head-imports}"></th:block>
</head>
<body>
<div class="status-page">
    <div class="empty-state">
        <span class="empty-state__icon"><i class="bi bi-exclamation-triangle"></i></span>
        <div class="status-page__code" th:text="${status} ?: '500'">500</div>
        <h3 class="mt-2">We could not complete that request</h3>
        <p th:text="${message} ?: 'Something went wrong on our side. Please try again, or head back to your dashboard.'">
            Something went wrong.
        </p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to my dashboard</a>
    </div>
</div>
<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
