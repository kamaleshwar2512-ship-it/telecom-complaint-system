<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Telecom Complaint Tracker</title>
    <th:block th:replace="~{fragments/common :: head-imports}"></th:block>
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="card-title mb-3 text-center">Telecom Complaint &amp; SLA Tracker</h3>
                    <p class="text-muted text-center mb-4">Sign in to continue</p>

                    <div class="alert alert-success" th:if="${registered}">Registration successful. Please log in.</div>
                    <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
                    <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Email</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        New customer? <a th:href="@{/register}">Create an account</a>
                    </p>

                    <hr/>
                    <p class="small text-muted mb-0">
                        Demo accounts (password <code>Password123</code>): <br/>
                        admin@telecom.com &middot; agent1@telecom.com &middot; customer1@telecom.com
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
