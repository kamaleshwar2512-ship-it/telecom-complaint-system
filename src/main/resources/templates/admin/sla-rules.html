<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SLA Rules - Telecom Complaint Tracker</title>
    <th:block th:replace="~{fragments/common :: head-imports}"></th:block>
</head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>
<div th:replace="~{fragments/common :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">SLA Rules</h2>
        <a th:href="@{/admin/sla-rules/new}" class="btn btn-primary">Add Rule</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Resolution Time (hours)</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(rules)}">
                    <td colspan="4" class="text-center text-muted py-4">No SLA rules configured yet.</td>
                </tr>
                <tr th:each="r : ${rules}">
                    <td th:text="${r.category}">CATEGORY</td>
                    <td th:text="${r.priority}">PRIORITY</td>
                    <td th:text="${r.resolutionHours}">24</td>
                    <td><a th:href="@{'/admin/sla-rules/' + ${r.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">Edit</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
