spring.application.name=telecom-complaint-system

# --- Database (MySQL 8.x) ---------------------------------------------------
# Override these with environment variables (DB_URL / DB_USERNAME / DB_PASSWORD) rather than
# editing this file, so real credentials never end up committed to source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/telecom_complaint_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---------------------------------------------------------
# "update" is convenient for this one-week project (it keeps the schema in sync with the
# entities automatically); a production system would use a migration tool such as Flyway instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- SLA monitoring -----------------------------------------------------------
# How often the SlaMonitoringService scheduled job re-checks every open complaint (milliseconds).
sla.monitoring.fixed-rate-ms=300000
# How many hours before the deadline a complaint is considered "at risk" (amber) and auto-escalated.
sla.at-risk-threshold-hours=4

# --- Misc ---------------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
