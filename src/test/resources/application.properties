spring.application.name=telecom-complaint-system-test

# Tests run against an in-memory H2 database so they don't need a real MySQL server. Production
# and normal local runs still use MySQL - see src/main/resources/application.properties. This is
# the one dependency added beyond what start.spring.io generated (test-scope only); see README.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Run the SLA scheduler far less often during tests - individual tests call the service method
# directly instead of waiting on the schedule.
sla.monitoring.fixed-rate-ms=3600000
sla.at-risk-threshold-hours=4

# Keep the test database clean and predictable - no seeded demo rows.
app.demo-data.enabled=false
